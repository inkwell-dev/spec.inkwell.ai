rom, which is</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="252.3823" x="12" y="282.2351">what a citation [Title, p. N] points at. Deleting</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="273.4478" x="12" y="295.0398">a document removes its chunks and attachments</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="168.6416" x="12" y="307.8445">with it (ON DELETE CASCADE).</text></g><!--link User to Document--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" data-link-type="association" data-source-line="55" id="lnk6"><path codeLine="55" d="M629.5,87.67 C639.77,107.66 653.75,134.89 668.03,162.69" fill="none" id="User-Document" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="28.4292" x="655.42" y="137.2004">owns</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="6.9985" x="626.1244" y="105.3311">1</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="27.9888" x="635.9769" y="152.3181">0..20</text></g><!--link Document to DocumentChunk--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="association" data-source-line="56" id="lnk7"><path codeLine="56" d="M730.23,407.09 C730.23,427.81 730.23,448.42 730.23,466.42" fill="none" id="Document-DocumentChunk" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="83.9341" x="731.23" y="440.8804">is chunked into</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="6.9985" x="724.0852" y="424.7387">1</text><text fill="#000000" font-family="DejaVu Sans