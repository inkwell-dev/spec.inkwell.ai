ust="spacing" textLength="56.9873" x="575.7403" y="178.2104">Document</text><line style="stroke:#000000;stroke-width:0.5;" x1="528.98" x2="679.4878" y1="185.8047" y2="185.8047"/><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="52.5239" x="533.98" y="200.0151">-id : UUID</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="69.0024" x="533.98" y="212.8198">-title : String</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="95.4443" x="533.98" y="225.6245">-filename : String</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="116.5903" x="533.98" y="238.4292">-contentType : String</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="106.4336" x="533.98" y="251.2339">-sizeBytes : Integer</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="109.7744" x="533.98" y="264.0386">-storageKey : String</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="140.5078" x="533.98" y="276.8433">-status : DocumentStatus</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="114.3774" x="533.98" y="289.6479">-pageCount : Integer</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="120.2373" x="533.98" y="302.4526">-chunkCount : Integer</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="66.043" x="533.98" y="315.2573">-error : Text</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="130.3887" x="533.98" y="328.062">-createdAt : Timestamp</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="129.8838" x="533.98" y="340.8667">-deletedAt : Timestamp</text><line style="stroke:#000000;stroke-width:0.5;" x1="528.98" x2="679.4878" y1="347.4609" y2="347.4609"/><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="60.4624" x="533.98" y="361.6714">+register()</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="44.4351" x="533.98" y="374.4761">+retry()</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="59.8125" x="533.98" y="387.2808">+remove()</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="93.7095" x="533.98" y="400.0854">+fileUrl() : String</text></g><!--class DocumentChunk--><g class="entity" data-qualified-name="DocumentChunk" data-source-line="36" id="ent0004"><rect fill="#FFFFFF" height="82.0234" style="stroke:#000000;stroke-width:0.5;" width="130.0459" x="539.21" y="466.68"/><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="91.9531" x="558.2564" y="481.8904">DocumentChunk</text><line style="stroke:#000000;stroke-width:0.5;" x1="540.21" x2="668.2559" y1="489.4847" y2="489.4847"/><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="118.0459" x="545.21" y="503.6951">-chunkIndex : Integer</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="81.7104" x="545.21" y="516.4998">-page : Integer</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="81.0928" x="545.21" y="529.3045">-content : Text</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="112.7822" x="545.21" y="542.1092">-embedding : Vector</text></g><!--class DocumentStatus--><g class="entity" data-qualified-name="DocumentStatus" data-source-line="43" id="ent0005"><rect fill="#DAE8FC" height="95.9922" style="stroke:#000000;stroke-width:0.5;" width="98.0391" x="106.21" y="7"/><text fill="#000000" font-family="DejaVu Sans" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="91.9512" x="109.2539" y="23.1387">&#171;Enumeration&#187;</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="92.0391" x="109.21" y="36.1792">DocumentStatus</text><line style="stroke:#000000;stroke-width:0.5;" x1="107.21" x2="203.2491" y1="43.7734" y2="43.7734"/><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="44.7144" x="112.21" y="57.9839">pending</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="56.2246" x="112.21" y="70.7886">extracting</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="31.5229" x="112.21" y="83.5933">ready</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="30.4756" x="112.21" y="96.3979">failed</text></g><g class="entity" data-qualified-name="N1" data-source-line="55" id="ent0009"><path d="M221.76,24.39 L221.76,85.6088 L502.7102,85.6088 L502.7102,34.39 L492.7102,24.39 L221.76,24.39" fill="#FFF2CC" style="stroke:#D6B656;stroke-width:0.5;"/><path d="M492.7102,24.39 L492.7102,34.39 L502.7102,34.39 L492.7102,24.39" fill="#FFF2CC" style="stroke:#D6B656;stroke-width:1;"/><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="254.1709" x="227.76" y="39.6004">pending &#8594; extracting &#8594; ready, or failed with a</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="259.9502" x="227.76" y="52.4051">writer-readable reason in error. Nothing moves</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="251.1094" x="227.76" y="65.2098">backwards except a retry, which puts a failed</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="151.3843" x="227.76" y="78.0145">document back to pending.</text></g><g class="entity" data-qualified-name="N2" data-source-line="62" id="ent0010"><path d="M6,254.23 L6,315.4488 L304.4653,315.4488 L304.4653,264.23 L294.4653,254.23 L6,254.23" fill="#FFF2CC" style="stroke:#D6B656;stroke-width:0.5;"/><path d="M294.4653,254.23 L294.4653,264.23 L304.4653,264.23 L294.4653,254.23" fill="#FFF2CC" style="stroke:#D6B656;stroke-width:1;"/><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="277.4653" x="12" y="269.4404">Each chunk keeps the page it came from, which is</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="252.3823" x="12" y="282.2451">what a citation [Title, p. N] points at. Deleting</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="273.4478" x="12" y="295.0498">a document removes its chunks and attachments</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="168.6416" x="12" y="307.8545">with it (ON DELETE CASCADE).</text></g><!--link User to Document--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" data-link-type="association" data-source-line="50" id="lnk6"><path codeLine="50" d="M557.94,77.03 C562.46,97.24 569.69,129.53 577.1,162.64" fill="none" id="User-Document" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="28.4292" x="572.18" y="137.2104">owns</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="6.9985" x="552.5332" y="94.8