oke:#000000;stroke-width:0.5;" width="98.0391" x="106.21" y="7"/><text fill="#000000" font-family="DejaVu Sans" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="91.9512" x="109.2539" y="23.1387">&#171;Enumeration&#187;</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="92.0391" x="109.21" y="36.1792">DocumentStatus</text><line style="stroke:#000000;stroke-width:0.5;" x1="107.21" x2="203.2491" y1="43.7734" y2="43.7734"/><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="44.7144" x="112.21" y="57.9839">pending</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="56.2246" x="112.21" y="70.7886">extracting</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="31.5229" x="112.21" y="83.5933">ready</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="30.4756" x="112.21" y="96.3979">failed</text></g><g class="entity" data-qualified-name="N1" data-source-line="54" id="ent0011"><path d="M221.76,24.39 L221.76,85.6088 L502.7102,85.6088 L502.7102,34.39 L492.7102,24.39 L221.76,24.39" fill="#FFF2CC" style="stroke:#D6B656;stroke-width:0.5;"/><path d="M492.7102,24.39 L492.7102,34.39 L502.7102,34.39 L492.7102,24.39" fill="#FFF2CC" style="stroke:#D6B656;stroke-width:1;"/><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="254.1709" x="227.76" y="39.6004">pending &#8594; extracting &#8594; ready, or failed with a</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="259.9502" x="227.76" y="52.4051">writer-readable reason in error. Nothing moves</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="251.1094" x="227.76" y="65.2098">backwards except a retry, which puts a failed</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="151.3843" x="227.76" y="78.0145">document back to pending.</text></g><g class="entity" data-qualified-name="N2" data-source-line="61" id="ent0012"><path d="M6,224.62 L6,285.8388 L304.4653,285.8388 L304.4653,234.62 L294.4653,224.62 L6,224.62" fill="#FFF2CC" style="stroke:#D6B656;stroke-width:0.5;"/><path d="M294.4653,224.62 L294.4653,234.62 L304.4653,234.62 L294.4653,224.62" fill="#FFF2CC" style="stroke:#D6B656;stroke-width:1;"/><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="277.4653" x="12" y="239.8304">Each chunk keeps the page it came from, which is</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="252.3823" x="12" y="252.6351">what a citation [Title, p. N] points at. Deleting</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="273.4478" x="12" y="265.4398">a document removes its chunks and attachments</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="168.6416" x="12" y="278.2445">with it (ON DELETE CASCADE).</text></g><!--link User to Document--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" data-link-type="association" data-source-line="48" id="lnk7"><path codeLine="48" d="M553.23,77.21 C553.23,97.89 553.23,130.78 553.23,162.63" fill="none" id="User-Document" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="28.4292" x="554.23" y="137.2104">owns</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="6.9985" x="546.5574" y="95.1114">1</text><text fill="#00000