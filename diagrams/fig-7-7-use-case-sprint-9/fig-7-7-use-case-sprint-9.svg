00000" font-family="DejaVu Sans" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="82.207" x="719.2729" y="227.4023">to an article</text></g><!--entity DETACH--><g class="entity" data-qualified-name="..2.DETACH" data-source-line="18" id="ent0011"><ellipse cx="1059.3988" cy="217.9958" fill="#FFFFFF" rx="77.4288" ry="17.8858" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="DejaVu Sans" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="131.4551" x="993.6713" y="221.4801">Detach a document</text></g><!--entity ASK--><g class="entity" data-qualified-name="..2.ASK" data-source-line="19" id="ent0012"><ellipse cx="469.5612" cy="46.0008" fill="#FFFFFF" rx="85.0412" ry="22.6008" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="DejaVu Sans" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="116.9355" x="411.0934" y="42.7195">Ask the assistant</text><text fill="#000000" font-family="DejaVu Sans" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="113.2148" x="412.9538" y="56.6882">about the article</text></g><!--entity CITE--><g class="entity" data-qualified-name="..2.CITE" data-source-line="20" id="ent0013"><ellipse cx="760.3793" cy="44.0032" fill="#FFFFFF" rx="77.9793" ry="21.4832" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="DejaVu Sans" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="113.332" x="703.7133" y="42.3681">Cite passages as</text><text fill="#000000" font-family="DejaVu Sans" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="77.3613" x="721.6986" y="56.3369">[Title, p. N]</text></g><!--entity OPEN--><g class="entity" data-qualified-name="..2.OPEN" data-source-line="21" id="ent0014"><ellipse cx="1059.3957" cy="43.9991" fill="#FFFFFF" rx="94.5957" ry="21.3191" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="DejaVu Sans" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="145.5938" x="986.5989" y="43.3496">Open a cited passage</text><text fill="#000000" font-family="DejaVu Sans" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="72.5977" x="1023.0969" y="57.3184">at its page</text></g><!--entity R--><g class="entity" data-qualified-name="R" data-source-line="8" id="ent0001"><ellipse cx="163.0803" cy="225.51" fill="#FFFFFF" rx="8" ry="8" style="stroke:#000000;stroke-width:0.5;"/><path d="M163.0803,233.51 L163.0803,260.51 M150.0803,241.51 L176.0803,241.51 M163.0803,260.51 L150.0803,275.51 M163.0803,260.51 L176.0803,275.51" fill="none" style="stroke:#000000;stroke-width:0.5;"/><text fill="#000000" font-family="DejaVu Sans" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="43.0605" x="141.55" y="288.1487">Writer</text></g><g class="entity" data-qualified-name="N1" data-source-line="41" id="ent0028"><path d="M7.05,128.98 L7.05,203.0034 L319.1096,203.0034 L319.1096,138.98 L309.1096,128.98 L7.05,128.98" fill="#FFF2CC" style="stroke:#D6B656;stroke-width:0.5;"/><path d="M309.1096,128.98 L309.1096,138.98 L319.1096,138.98 L309.1096,128.98" fill="#FFF2CC" style="stroke:#D6B656;stroke-width:1;"/><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="291.0596" x="13.05" y="144.1904">PDF, DOCX, TXT or MD, under 10 MB and 200 pages,</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="268.3398" x="13.05" y="156.9951">at most 20 per writer (FR-84). A document is the</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="246.5493" x="13.05" y="169.7998">writer's alone: it never feeds writer memory,</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="272.1748" x="13.05" y="182.6045">Portfolio Insights or search, and no other account</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="213.3613" x="13.05" y="195.4092">can read, attach or discover it (FR-87).</text></g><g class="entity" data-qualified-name="N2" data-source-line="49" id="ent0029"><path d="M6,66.79 L6,115.2041 L320.1543,115.2041 L320.1543,76.79 L310.1543,66.79 L6,66.79" fill="#FFF2CC" style="stroke:#D6B656;stroke-width:0.5;"/><path d="M310.1543,66.79 L310.1543,76.79 L320.1543,76.79 L310.1543,66.79" fill="#FFF2CC" style="stroke:#D6B656;stroke-width:1;"/><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="267.894" x="12" y="82.0004">Citations appear only when attached documents</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="293.1543" x="12" y="94.8051">supplied passages; with none attached, the assistant</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="263.3286" x="12" y="107.6098">writes from the writer's published work (FR-86).</text></g><!--link R to LIB--><g class="link" data-entity-1="ent0001" data-entity-2="ent0005" data-link-type="dependency" data-source-line="24" id="lnk15"><path d="M184.85,255.97 C243.91,260.98 417.46,271.64 555.96,239 C610.56,226.13 618.68,207.32 670.96,187 C682.4,182.55 690.0946,179.7551 701.9346,175.8251" fill="none" id="R-to-LIB" style="stroke:#000000;stroke-width:1;"/><polygon fill="#000000" points="706.68,174.25,696.8781,173.2889,701.9346,175.8251,699.3984,180.8816,706.68,174.25" style="stroke:#000000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link R to ATTACH--><g class="link" data-entity-1="ent0001" data-entity-2="ent0010" data-link-type="dependency" data-source-line="25" id="lnk16"><path d="M184.81,257.71 C251.73,268.99 467.67,300.08 640.96,265 C669.83,259.15 695.9301,248.2604 718.7