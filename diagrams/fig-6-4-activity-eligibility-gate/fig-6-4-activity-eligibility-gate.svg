<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:831px;height:1002px;background:#FFFFFF;" width="831px" height="1002px" viewBox="0 0 831 1002" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><ellipse cx="348.58" cy="25" rx="10" ry="10" fill="#000" style="stroke:#222;stroke-width:1;"/><rect x="16" y="45" width="795.999" height="534.113" fill="#FFF" style="stroke:#000;stroke-width:1.5;"/><path d="M246.934,45 L246.934,51.969 L236.934,61.969 L16,61.969" style="stroke:#000;stroke-width:1.5;" fill="none"/><text x="19" y="57.139" fill="#000" font-size="12" textLength="220.934" font-family="DejaVu Sans">Scheduled worker, every 20 minutes</text><path d="M515.704,78.969 L515.704,99.176 L495.704,103.176 L515.704,107.176 L515.704,127.383 A0,0 0 0 0 515.704,127.383 L801.999,127.383 A0,0 0 0 0 801.999,127.383 L801.999,88.969 L791.999,78.969 L515.704,78.969 A0,0 0 0 0 515.704,78.969" style="stroke:#D6B656;stroke-width:0.5;" fill="#FFF2CC"/><path d="M791.999,78.969 L791.999,88.969 L801.999,88.969 L791.999,78.969" style="stroke:#D6B656;stroke-width:0.5;" fill="#FFF2CC"/><text x="521.704" y="94.179" fill="#000" font-size="11" textLength="236.94" font-style="italic" font-family="DejaVu Sans">Writers with no published public article are</text><text x="521.704" y="106.984" fill="#000" font-size="11" textLength="251.818" font-style="italic" font-family="DejaVu Sans">provably at 0 on both counts. Excluding them</text><text x="521.704" y="119.789" fill="#000" font-size="11" textLength="265.294" font-style="italic" font-family="DejaVu Sans">took this sweep from 22 minutes to 15 seconds.</text><rect x="201.456" y="79.207" width="294.248" height="47.938" fill="#FFF" style="stroke:#000;stroke-width:0.5;"/><text x="211.456" y="100.346" fill="#000" font-size="12" textLength="227.871" font-family="DejaVu Sans">Select writers who are not yet eligible</text><text x="211.456" y="114.314" fill="#000" font-size="12" textLength="274.248" font-family="DejaVu Sans">and have at least one published public article</text><path d="M477.747,202.855 L477.747,223.062 L457.747,227.062 L477.747,231.062 L477.747,251.269 A0,0 0 0 0 477.747,251.269 L766.313,251.269 A0,0 0 0 0 766.313,251.269 L766.313,212.855 L756.313,202.855 L477.747,202.855 A0,0 0 0 0 477.747,202.855" style="stroke:#D6B656;stroke-width:0.5;" fill="#FFF2CC"/><path d="M756.313,202.855 L756.313,212.855 L766.313,212.855 L756.313,202.855" style="stroke:#D6B656;stroke-width:0.5;" fill="#FFF2CC"/><text x="483.747" y="218.065" fill="#000" font-size="11" textLength="267.566" font-style="italic" font-family="DejaVu Sans">Anonymous views carry no viewer id and cannot</text><text x="483.747" y="230.87" fill="#000" font-size="11" textLength="252.436" font-style="italic" font-family="DejaVu Sans">count toward a tally of people, so the real bar</text><text x="483.747" y="243.675" fill="#000" font-size="11" textLength="159.124" font-style="italic" font-family="DejaVu Sans">is 5,000 *identified* readers.</text><rect x="239.413" y="203.093" width="218.334" height="47.938" fill="#FFF" style="stroke:#000;stroke-width:0.5;"/><text x="249.413" y="224.232" fill="#000" font-size="12" textLength="193.623" font-family="DejaVu Sans">Count distinct identified readers</text><text x="249.413" y="238.201" fill="#000" font-size="12" textLength="198.334" font-family="DejaVu Sans">across the writer's public articles</text><rect x="225.696" y="271.269" width="245.768" height="33.969" fill="#FFF" style="stroke:#000;stroke-width:0.5;"/><text x="235.696" y="292.408" fill="#000" font-size="12" textLength="225.768" font-family="DejaVu Sans">Count reactions: likes plus comments</text><polygon points="217.521,325.238,479.64,325.238,491.64,337.238,479.64,349.238,217.521,349.238,205.521,337.238,217.521,325.238" fill="#FFF" style="stroke:#000;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="217.521" y="341.392" fill="#000" font-size="12" textLength="262.119" font-family="DejaVu Sans">readers >= 5,000 and reactions >= 1,000?</text><text x="186.512" y="334.644" fill="#000" font-size="11" textLength="19.008" font-family="DejaVu Sans">yes</text><text x="491.64" y="334.644" fill="#000" font-size="11" textLength="13.702" font-family="DejaVu Sans">no</text><rect x="103.65" y="359.238" width="183.74" height="33.969" fill="#FFF" style="stroke:#000;stroke-width:0.5;"/><text x="113.65" y="380.376" fill="#000" font-size="12" textLength="163.74" font-family="DejaVu Sans">Set is_marketplace_eligible</text><rect x="46" y="413.207" width="299.041" height="33.969" fill="#FFF" style="stroke:#000;stroke-width:0.5;"/><text x="56" y="434.345" fill="#000" font-size="12" textLength="279.041" font-family="DejaVu Sans">Record the timestamp and source = threshold</text><rect x="66.886" y="467.175" width="257.27" height="47.938" fill="#FFF" style="stroke:#000;stroke-width:0.5;"/><text x="76.886" y="488.314" fill="#000" font-size="12" textLength="237.27" font-family="DejaVu Sans">Append a row to the eligibility audit log</text><text x="76.886" y="502.283" fill="#000" font-size="12" textLength="163.799" font-family="DejaVu Sans">with both metric snapshots</text><rect x="413.429" y="359.238" width="176.422" height="33.969" fill="#FFF" style="stroke:#000;stroke-width:0.5;"/><text x="423.429" y="380.376" fill="#000" font-size="12" textLength="156.422" font-family="DejaVu Sans">Leave the writer ineligible</text><polygon points="348.58,521.113,360.58,533.113,348.58,545.113,336.58,533.113,348.58,521.113" fill="#FFF" style="stroke:#000;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon points="290.241,147.383,406.919,147.383,418.919,159.383,406.919,171.383,290.241,171.383,278.241,159.383,290.241,147.383" fill="#FFF" style="stroke:#000;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="352.58" y="181.593" fill="#000" font-size="11" textLength="19.008" font-family="DejaVu Sans">yes</text><text x="290.241" y="163.537" fill="#000" font-size="12" textLength="116.678" font-family="DejaVu Sans">another candidate?</text><text x="232.308" y="156.789" fill="#000" font-size="11" textLength="45.934" font-family="DejaVu Sans">no more</text><rect x="134.033" y="589.113" width="441.094" height="280.277" fill="#FFF" style="stroke:#000;stroke-width:1.5;"/><path d="M298.316,589.113 L298.316,596.082 L288.316,606.082 L134.033,606.082" style="stroke:#000;stroke-width:1.5;" fill="none"/><text x="137.033" y="601.251" fill="#000" font-size="12" textLength="154.283" font-family="DejaVu Sans">Administrator, on request</text><rect x="256.71" y="671.484" width="183.74" height="33.969" fill="#FFF" style="stroke:#000;stroke-width:0.5;"/><text x="266.71" y="692.623" fill="#000" font-size="12" textLength="163.74" font-family="DejaVu Sans">Set is_marketplace_eligible</text><rect x="154.033" y="725.453" width="389.094" height="33.969" fill="#FFF" style="stroke:#000;stroke-width:0.5;"/><text x="164.033" y="746.591" fill="#000" font-size="12" textLength="369.094" font-family="DejaVu Sans">Record source = admin_grant and the granting administrator</text><rect x="219.945" y="779.421" width="257.27" height="33.969" fill="#FFF" style="stroke:#000;stroke-width:0.5;"/><text x="229.945" y="800.56" fill="#000" font-size="12" textLength="237.27" font-family="DejaVu Sans">Append a row to the eligibility audit log</text><polygon points="245.168,623.082,451.992,623.082,463.992,635.082,451.992,647.082,245.168,647.082,233.168,635.082,245.168,623.082" fill="#FFF" style="stroke:#000;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="352.58" y="657.292" fill="#000" font-size="11" textLength="19.008" font-family="DejaVu Sans">yes</text><text x="245.168" y="639.236" fill="#000" font-size="12" textLength="206.824" font-family="DejaVu Sans">an administrator grants eligibility?</text><text x="463.992" y="632.487" fill="#000" font-size="11" textLength="13.702" font-family="DejaVu Sans">no</text><polygon points="348.58,833.39,360.58,845.39,348.58,857.39,336.58,845.39,348.58,833.39" fill="#FFF" style="stroke:#000;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M500.777,879.39 L500.777,906 L480.777,910 L500.777,914 L500.777,940.609 A0,0 0 0 0 500.777,940.609 L800.295,940.609 A0,0 0 0 0 800.295,940.609 L800.295,889.39 L790.295,879.39 L500.777,879.39 A0,0 0 0 0 500.777,879.39" style="stroke:#D6B656;stroke-width:0.5;" fill="#FFF2CC"/><path d="M790.295,879.39 L790.295,889.39 L800.295,889.39 L790.295,879.39" style="stroke:#D6B656;stroke-width:0.5;" fill="#FFF2CC"/><text x="506.777" y="894.601" fill="#000" font-size="11" textLength="247.973" font-style="italic" font-family="DejaVu Sans">The threshold is a lifetime sum, so the flag is</text><text x="506.777" y="907.405" fill="#000" font-size="11" textLength="278.518" font-style="italic" font-family="DejaVu Sans">monotonic. Revocation is possible only through an</text><text x="506.777" y="920.21" fill="#000" font-size="11" textLength="277.557" font-style="italic" font-family="DejaVu Sans">explicit administrative action, which the MVP does</text><text x="506.777" y="933.015" fill="#000" font-size="11" textLength="59.259" font-style="italic" font-family="DejaVu Sans">not model.</text><rect x="216.383" y="893.015" width="264.395" height="33.969" fill="#FFF" style="stroke:#000;stroke-width:0.5;"/><text x="226.383" y="914.154" fill="#000" font-size="12" textLength="244.395" font-family="DejaVu Sans">Eligibility is never revoked automatically</text><ellipse cx="348.58" cy="971.609" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="348.58" cy="971.609" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="348.58" y1="251.031" x2="348.58" y2="271.269" style="stroke:#000;stroke-width:1;"/><polygon points="344.58,261.269,348.58,271.269,352.58,261.269,34