<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1002px" preserveAspectRatio="none" style="width:835px;height:1002px;background:#FFFFFF;" version="1.1" viewBox="0 0 835 1002" width="835px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><ellipse cx="348.5801" cy="25" fill="#000000" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#FFFFFF" height="534.1128" style="stroke:#000000;stroke-width:1.5;" width="799.3179" x="16" y="45"/><path d="M246.9336,45 L246.9336,51.9688 L236.9336,61.9688 L16,61.9688" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="220.9336" x="19" y="57.1387">Scheduled worker, every 20 minutes</text><path d="M515.7041,78.9688 L515.7041,99.1758 L495.7041,103.1758 L515.7041,107.1758 L515.7041,127.3828 A0,0 0 0 0 515.7041,127.3828 L805.3179,127.3828 A0,0 0 0 0 805.3179,127.3828 L805.3179,88.9688 L795.3179,78.9688 L515.7041,78.9688 A0,0 0 0 0 515.7041,78.9688" fill="#FFF2CC" style="stroke:#D6B656;stroke-width:0.5;"/><path d="M795.3179,78.9688 L795.3179,88.9688 L805.3179,88.9688 L795.3179,78.9688" fill="#FFF2CC" style="stroke:#D6B656;stroke-width:0.5;"/><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="236.9404" x="521.7041" y="94.1792">Writers with no published public article are</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="268.6138" x="521.7041" y="106.9839">provably at zero on both counts. Excluding them</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="265.2944" x="521.7041" y="119.7886">took this sweep from 22 minutes to 15 seconds.</text><rect fill="#FFFFFF" height="47.9375" style="stroke:#000000;stroke-width:0.5;" width="294.248" x="201.4561" y="79.207"/><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="227.8711" x="211.4561" y="100.3457">Select writers who are not yet eligible</text><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="274.248" x="211.4561" y="114.3145">and have at least one published public article</text><path d="M477.7471,202.855 L477.7471,223.062 L457.7471,227.062 L477.7471,231.062 L477.7471,251.269 A0,0 0 0 0 477.7471,251.269 L766.3135,251.269 A0,0 0 0 0 766.3135,251.269 L766.3135,212.855 L756.3135,202.855 L477.7471,202.855 A0,0 0 0 0 477.7471,202.855" fill="#FFF2CC" style="stroke:#D6B656;stroke-width:0.5;"/><path d="M756.3135,202.855 L756.3135,212.855 L766.3135,212.855 L756.3135,202.855" fill="#FFF2CC" style="stroke:#D6B656;stroke-width:0.5;"/><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="267.5664" x="483.7471" y="218.0654">Anonymous views carry no viewer id and cannot</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="252.436" x="483.7471" y="230.8701">count toward a tally of people, so the real bar</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="159.124" x="483.7471" y="243.6748">is 5,000 *identified* readers.</text><rect fill="#FFFFFF" height="47.9375" style="stroke:#000000;stroke-width:0.5;" width="218.334" x="239.4131" y="203.0933"/><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="193.623" x="249.4131" y="224.2319">Count distinct identified readers</text><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="198.334" x="249.4131" y="238.2007">across the writer's public articles</text><rect fill="#FFFFFF" height="33.9688" style="stroke:#000000;stroke-width:0.5;" width="245.7676" x="225.6963" y="271.269"/><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="225.7676" x="235.6963" y="292.4077">Count reactions: likes plus comments</text><polygon fill="#FFFFFF" points="217.5205,325.2378,479.6396,325.2378,491.6396,337.2378,479.6396,349.2378,217.5205,349.2378,205.5205,337.2378,217.5205,325.2378" style="stroke:#000000;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="262.1191" x="217.5205" y="341.3921">readers &gt;= 5,000 and reactions &gt;= 1,000?</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="186.5122" y="334.6436">yes</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="491.6396" y="334.6436">no</text><rect fill="#FFFFFF" height="33.9688" style="stroke:#000000;stroke-width:0.5;" width="183.7402" x="103.6504" y="359.2378"/><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="163.7402" x="113.6504" y="380.3765">Set is_marketplace_eligible</text><rect fill="#FFFFFF" height="33.9688" style="stroke:#000000;stroke-width:0.5;" width="299.041" x="46" y="413.2065"/><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="279.041" x="56" y="434.3452">Record the timestamp and source = threshold</text><rect fill="#FFFFFF" height="47.9375" style="stroke:#000000;stroke-width:0.5;" width="257.2695" x="66.8857" y="467.1753"/><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="237.2695" x="76.8857" y="488.314">Append a row to the eligibility audit log</text><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="163.7988" x="76.8857" y="502.2827">with both metric snapshots</text><rect fill="#FFFFFF" height="33.9688" style="stroke:#000000;stroke-width:0.5;" width="176.4219" x="413.4287" y="359.2378"/><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="156.4219" x="423.4287" y="380.3765">Leave the writer ineligible</text><polygon fill="#FFFFFF" points="348.5801,521.1128,360.5801,533.1128,348.5801,545.1128,336.5801,533.1128,348.5801,521.1128" style="stroke:#000000;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><polygon fill="#FFFFFF" points="290.2412,147.3828,406.9189,147.3828,418.9189,159.3828,406.9189,171.3828,290.2412,171.3828,278.2412,159.3828,290.2412,147.3828" style="stroke:#000000;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="352.5801" y="181.5933">yes</text><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="116.6777" x="290.2412" y="163.5371">another candidate?</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="45.9336" x="232.3076" y="156.7886">no more</text><rect fill="#FFFFFF" height="280.2773" style="stroke:#000000;stroke-width:1.5;" width="441.0938" x="134.0332" y="589.1128"/><path d="M298.3164,589.1128 L298.3164,596.0815 L288.3164,606.0815 L134.0332,606.0815" fill="none" style="stroke:#000000;stroke-width:1.5;"/><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="154.2832" x="137.0332" y="601.2515">Administrator, on request</text><rect fill="#FFFFFF" height="33.9688" style="stroke:#000000;stroke-width:0.5;" width="183.7402" x="256.71" y="671.4839"/><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="163.7402" x="266.71" y="692.6226">Set is_marketplace_eligible</text><rect fill="#FFFFFF" height="33.9688" style="stroke:#000000;stroke-width:0.5;" width="389.0938" x="154.0332" y="725.4526"/><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="369.0938" x="164.0332" y="746.5913">Record source = admin_grant and the granting administrator</text><rect fill="#FFFFFF" height="33.9688" style="stroke:#000000;stroke-width:0.5;" width="257.2695" x="219.9453" y="779.4214"/><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="237.2695" x="229.9453" y="800.5601">Append a row to the eligibility audit log</text><polygon fill="#FFFFFF" points="245.168,623.0815,451.9922,623.0815,463.9922,635.0815,451.9922,647.0815,245.168,647.0815,233.168,635.0815,245.168,623.0815" style="stroke:#000000;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="352.5801" y="657.292">yes</text><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="206.8242" x="245.168" y="639.2358">an administrator grants eligibility?</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="463.9922" y="632.4873">no</text><polygon fill="#FFFFFF" points="348.5801,833.3901,360.5801,845.3901,348.5801,857.3901,336.5801,845.3901,348.5801,833.3901" style="stroke:#000000;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M500.7773,879.3901 L500.7773,905.9995 L480.7773,909.9995 L500.7773,913.9995 L500.7773,940.6089 A0,0 0 0 0 500.7773,940.6089 L800.2954,940.6089 A0,0 0 0 0 800.2954,940.6089 L800.2954,889.3901 L790.2954,879.3901 L500.7773,879.3901 A0,0 0 0 0 500.7773,879.3901" fill="#FFF2CC" style="stroke:#D6B656;stroke-width:0.5;"/><path d="M790.2954,879.3901 L790.2954,889.3901 L800.2954,889.3901 L790.2954,879.3901" fill="#FFF2CC" style="stroke:#D6B656;stroke-width:0.5;"/><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="247.9727" x="506.7773" y="894.6006">The threshold is a lifetime sum, so the flag is</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="278.5181" x="506.7773" y="907.4053">monotonic. Revocation is possible only through an</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="277.5566" x="506.7773" y="920.21">explicit administrative action, which the MVP does</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="59.2593" x="506.7773" y="933.0146">not model.</text><rect fill="#FFFFFF" height="33.9688" style="stroke:#000000;stroke-width:0.5;" width="264.3945" x="216.3828" y="893.0151"/><text fill="#000000" font-family="DejaVu Sans" font-size="12" lengthAdjust="spacing" textLength="244.3945" x="226.3828" y="914.1538">Eligibility is never revoked automatically</text><ellipse cx="348.5801" cy="971.6089" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="348.5801" cy="971.6089" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1;" x1="348.5801" x2="348.5801" y1="251.0308" y2="271.269"/><polygon fill="#000000" points="344.5801,261.269,348.5801,271.269,352.5801,261.269,348.5801,265.269" style="stroke:#000000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#000000;stroke-width:1;" x1="195.5205" x2="195.5205" y1="393.2065" y2="413.2065"/><polygon fill="#000000" points="191.5205,403.2065,195.5205,413.2065,199.5205,403.2065,195.5205,407.2065" style="stroke:#000000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#000000;stroke-width:1;" x1="195.5205" x2="195.5205" y1="447.1753" y2="467.1753"/><polygon fill="#000000" points="191.5205,457.1753,195.5205,467.1753,199.5205,457.1753,195.5205,461.1753" style="stroke:#000000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#000000;stroke-width:1;" x1="205.5205" x2="195.5205" y1="337.2378" y2="337.2378"/><line style="stroke:#000000;stroke-width:1;" x1="195.5205" x2="195.5205" y1="337.2378" y2="359.2378"/><polygon fill="#000000" points="191.5205,349.2378,195.5205,359.2378,199.5205,349.2378,195.5205,353.2378" style="stroke:#000000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#000000;stroke-width:1;" x1="491.6396" x2="501.6396" y1="337.2378" y2="337.2378"/><line style="stroke:#000000;stroke-width:1;" x1="501.6396" x2="501.6396" y1="337.2378" y2="359.2378"/><polygon fill="#000000" points="497.6396,349.2378,501.6396,359.2378,505.6396,349.2378,501.6396,353.2378" style="stroke:#000000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#000000;stroke-width:1;" x1="195.5205" x2="195.5205" y1="515.1128" y2="533.1128"/><line style="stroke:#000000;stroke-width:1;" x1="195.5205" x2="336.5801" y1="533.1128" y2="533.1128"/><polygon fill="#000000" points="326.5801,529.1128,336.5801,533.1128,326.5801,537.1128,330.5801,533.1128" style="stroke:#000000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#000000;stroke-width:1;" x1="501.6396" x2="501.6396" y1="393.2065" y2="533.1128"/><line style="stroke:#000000;stroke-width:1;" x1="501.6396" x2="360.5801" y1="533.1128" y2="533.1128"/><polygon fill="#000000" points="370.5801,529.1128,360.5801,533.1128,370.5801,537.1128,366.5801,533.1128" style="stroke:#000000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#000000;stroke-width:1;" x1="348.5801" x2="348.5801" y1="305.2378" y2="325.2378"/><polygon fill="#000000" points="344.5801,315.2378,348.5801,325.2378,352.5801,315.2378,348.5801,319.2378" style="stroke:#000000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#000000;stroke-width:1;" x1="348.5801" x2="348.5801" y1="171.382