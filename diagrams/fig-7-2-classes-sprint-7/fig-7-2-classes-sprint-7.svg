: String</text></g><!--class Comment--><g class="entity" data-qualified-name="Comment" data-source-line="20" id="ent0003"><rect fill="#FFFFFF" height="56.4141" style="stroke:#000000;stroke-width:0.5;" width="93.0928" x="542.23" y="302.86"/><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="53.8936" x="561.8296" y="318.0704">Comment</text><line style="stroke:#000000;stroke-width:0.5;" x1="543.23" x2="634.3228" y1="325.6647" y2="325.6647"/><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="52.5239" x="548.23" y="339.8751">-id : UUID</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="81.0928" x="548.23" y="352.6798">-content : Text</text></g><!--class Notification--><g class="entity" data-qualified-name="Notification" data-source-line="24" id="ent0004"><rect fill="#FFFFFF" height="90.0234" style="stroke:#000000;stroke-width:0.5;" width="141.3359" x="671.11" y="152.83"/><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="63.1157" x="710.2201" y="168.0404">Notification</text><line style="stroke:#000000;stroke-width:0.5;" x1="672.11" x2="811.4459" y1="175.6347" y2="175.6347"/><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="129.3359" x="677.11" y="189.8451">-type : NotificationType</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="62.1221" x="677.11" y="202.6498">-data : Json</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="96.1318" x="677.11" y="215.4545">-isRead : Boolean</text><line style="stroke:#000000;stroke-width:0.5;" x1="672.11" x2="811.4459" y1="222.0487" y2="222.0487"/><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="74.2822" x="677.11" y="236.2592">+markRead()</text></g><!--class NotificationType--><g class="entity" data-qualified-name="NotificationType" data-source-line="31" id="ent0005"><rect fill="#DAE8FC" height="83.1875" style="stroke:#000000;stroke-width:0.5;" width="96.0947" x="109.73" y="7.82"/><text fill="#000000" font-family="DejaVu Sans" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="91.9512" x="111.8018" y="23.9587">&#171;Enumeration&#187;</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="90.0947" x="112.73" y="36.9992">NotificationType</text><line style="stroke:#000000;stroke-width:0.5;" x1="110.73" x2="204.8247" y1="44.5934" y2="44.5934"/><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="10.4897" x="115.73" y="58.8039">...</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="77.0107" x="115.73" y="71.6086">comment_like</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="25.749" x="115.73" y="84.4133">save</text></g><g class="entity" data-qualified-name="N1" data-source-line="44" id="ent0011"><path d="M224.14,6 L224.14,92.8281 L551.4159,92.8281 L551.4159,16 L541.4159,6 L224.14,6" fill="#FFF2CC" style="stroke:#D6B656;stroke-width:0.5;"/><path d="M541.4159,6 L541.4159,16 L551.4159,16 L541.4159,6" fill="#FFF2CC" style="stroke:#D6B656;stroke-width:1;"/><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="289.5503" x="230.14" y="21.2104">Each association is stored as a join table holding the</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="302.7524" x="230.14" y="34.0151">pair and a date, with a unique constraint on the pair &#8212;</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="293.3745" x="230.14" y="46.8198">(user, comment), (blocker, blocked), (user, article) &#8212;</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="294.5562" x="230.14" y="59.6245">so a repeated request is a no-op, and a notification is</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="260.8687" x="230.14" y="72.4292">emitted only when a row was actually inserted.</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="306.2759" x="230.14" y="85.2339">blocks also has a CHECK: no one can block themselves.</text></g><g class="entity" data-qualified-name="N2" data-source-line="53" id="ent0012"><path d="M6,173.64 L6,222.0541 L309.5518,222.0541 L309.5518,183.64 L299.5518,173.64 L6,173.64" fill="#FFF2CC" style="stroke:#D6B656;stroke-width:0.5;"/><path d="M299.5518,173.64 L299.5518,183.64 L309.5518,183.64 L299.5518,173.64" fill="#FFF2CC" style="stroke:#D6B656;stroke-width:1;"/><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="273.0718" x="12" y="188.8504">A block row is directional, but every read treats it</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="282.5518" x="12" y="201.6551">both ways: a block in either direction hides the two</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="145.2129" x="12" y="214.4598">accounts from each other.</text></g><!--link User to Comment--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" data-link-type="association" data-source-line="37" id="lnk6"><path codeLine="37" d="M628.45,77.79 C630.36,121.34 631.19,208.77 612.78,279.86 C610.81,287.43 607.69,295.24 604.34,302.37" fill="none" id="User-Comment" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="24.981" x="629.88" y="202.0504">likes</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="19.4917" x="607.6979" y="96.0422">0..*</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="19.4917" x="586.8779" y="292.2211">0..*</text></g><!--link User to User--><g class="link" data-entity-1="ent0001" data-entity-2="ent0001" data-link-type="association" data-source-line="38" id="lnk7"><path codeLine="38" d="M684.58,36.46 C694.91,38.14 702.12,42.46 702.12,49.42 C702.12,56.37 694.91,60.69 684.58,62.38" fill="none" id="User-User" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="34.9175" x="708.12" y="53.6304">blocks</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="19.4917" x="691.9687" y="32.641">0..*</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="19.4917" x="691.9687" y="74.7085">0..*</text></g><!--link User to Article--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="association" data-source-line="39" id="lnk8"><path codeLine="39" d="M604.45,78 C595.99,89.28 586.74,102.75 579.78,115.83 C571.89,130.66 565.16,148.02 560.09,162.86" fill="none" id="User-Article" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="31.48" x="580.78" y="127.0404">saves</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="19.4917" x="578.5427" y="95.8635">0..*</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="19.4917" x="541.308" y="152.7014">0..*</text></g><!--link User to Notification--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" data-link-type="association" data-source-line="40" id="lnk9"><path codeLine="40" d="M648.41,77.96 C664.87,98.92 687.86,128.19 706.91,152.45" fill="none" id="User-Notification" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="46.1699" x="688.72" y="127.0404">receives</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="6.9985" x="646.5962" y="95.8147">1</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="19.4917" x="680.6023" y="142.2153">0..*</text></g><!--link Article to Comment--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="association" data-source-line="41" id="lnk10"><path codeLine="41" d="M559.8,232.75 C564.1,247.26 569.17,264.39 573.78,279.86 C575.95,287.18 578.32,295.1 580.51,302.44" fill="none" id="Article-Comment" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="37.3882" x="574.78" y="277.0704">carries</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="6.9985" x="555.1866" y="250.5775">1</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="19.4917" x="557.2394" y="292.3082">0..*</text></g><?plantuml-src TLJRJjmm47tFLqnvOMbtKw0NgWWXqIrLBn8FN9xHu0mRTnqxjHtIgAhKZ-WNzaiwuoImgF2Io_YSkHzlmqUzQZt1GRuF2rWQ305AZIkFzHpE6wzjX8C2bAjhua-ZrnJcS6sSMWT0MqB0MmhPDbnKdWWiTH3nsb20sSUpnTlTESXhVtYzsfb3wR6pW05YHL2ZxHVHBUJDFZYuKngZTZQTzu2UvYcCe6FdmBgeRxHA68XzGoEGQXrpTd4PoC_Xs4Uj32NcSamTcuRGGwTZ1SwQFhd46Bs-RkFW9gMlf0VytmRAisVQAjEM17d-yYh4tb3UjBN9mbhR1hb9d519WHhOUxTXz6ZNOdpz9giqivNsdCxmJNKJUwWfLguCMPR2fRJXPmOy0rr20PUNdp-aFyx2Mwo9RUUSgbrblqRALEDZhAYZsQ28APXszR-JgJcFEL7EHZahu89-n3lAwUO41fxCWM6R9nTiIcSbHkIpBy