ss Comment--><g class="entity" data-qualified-name="Comment" data-source-line="31" id="ent0003"><rect fill="#FFFFFF" height="77.2188" style="stroke:#000000;stroke-width:0.5;" width="199.3545" x="548.1" y="409.48"/><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="53.8936" x="620.8305" y="424.6904">Comment</text><line style="stroke:#000000;stroke-width:0.5;" x1="549.1" x2="746.4545" y1="432.2847" y2="432.2847"/><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="52.5239" x="554.1" y="446.4951">-id : UUID</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="81.0928" x="554.1" y="459.2998">-content : Text</text><line style="stroke:#000000;stroke-width:0.5;" x1="549.1" x2="746.4545" y1="465.8941" y2="465.8941"/><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="187.3545" x="554.1" y="480.1045">+reply(content : Text) : Comment</text></g><!--class Notification--><g class="entity" data-qualified-name="Notification" data-source-line="36" id="ent0004"><rect fill="#FFFFFF" height="90.0234" style="stroke:#000000;stroke-width:0.5;" width="141.3359" x="731.11" y="259.46"/><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="63.1157" x="770.2201" y="274.6704">Notification</text><line style="stroke:#000000;stroke-width:0.5;" x1="732.11" x2="871.4459" y1="282.2647" y2="282.2647"/><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="129.3359" x="737.11" y="296.4751">-type : NotificationType</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="62.1221" x="737.11" y="309.2798">-data : Json</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="96.1318" x="737.11" y="322.0845">-isRead : Boolean</text><line style="stroke:#000000;stroke-width:0.5;" x1="732.11" x2="871.4459" y1="328.6788" y2="328.6788"/><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="74.2822" x="737.11" y="342.8892">+markRead()</text></g><!--class NotificationType--><g class="entity" data-qualified-name="NotificationType" data-source-line="43" id="ent0005"><rect fill="#DAE8FC" height="83.1875" style="stroke:#000000;stroke-width:0.5;" width="96.0947" x="109.73" y="61.63"/><text fill="#000000" font-family="DejaVu Sans" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="91.9512" x="111.8018" y="77.7687">&#171;Enumeration&#187;</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="90.0947" x="112.73" y="90.8092">NotificationType</text><line style="stroke:#000000;stroke-width:0.5;" x1="110.73" x2="204.8247" y1="98.4034" y2="98.4034"/><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="10.4897" x="115.73" y="112.6139">...</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="77.0107" x="115.73" y="125.4186">comment_like</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="25.749" x="115.73" y="138.2233">save</text></g><g class="entity" data-qualified-name="N1" data-source-line="56" id="ent0011"><path d="M224.14,59.81 L224.14,146.6381 L551.4159,146.6381 L551.4159,69.81 L541.4159,59.81 L224.14,59.81" fill="#FFF2CC" style="stroke:#D6B656;stroke-width:0.5;"/><path d="M541.4159,59.81 L541.4159,69.81 L551.4159,69.81 L541.4159,59.81" fill="#FFF2CC" style="stroke:#D6B656;stroke-width:1;"/><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="289.5503" x="230.14" y="75.0204">Each association is stored as a join table holding the</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="302.7524" x="230.14" y="87.8251">pair and a date, with a unique constraint on the pair &#8212;</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="293.3745" x="230.14" y="100.6298">(user, comment), (blocker, blocked), (user, article) &#8212;</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="294.5562" x="230.14" y="113.4345">so a repeated request is a no-op, and a notification is</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="260.8687" x="230.14" y="126.2392">emitted only when a row was actually inserted.</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="306.2759" x="230.14" y="139.0439">blocks also has a CHECK: no one can block themselves.</text></g><g class="entity" data-qualified-name="N2" data-source-line="65" id="ent0012"><path d="M6,280.26 L6,328.6741 L309.5518,328.6741 L309.5518,290.26 L299.5518,280.26 L6,280.26" fill="#FFF2CC" style="stroke:#D6B656;stroke-width:0.5;"/><path d="M299.5518,280.26 L299.5518,290.26 L309.5518,290.26 L299.5518,280.26" fill="#FFF2CC" style="stroke:#D6B656;stroke-width:1;"/><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="273.0718" x="12" y="295.4704">A block row is directional, but every read treats it</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="282.5518" x="12" y="308.2751">both ways: a block in either direction hides the two</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="145.2129" x="12" y="321.0798">accounts from each other.</text></g><!--link User to Comment--><g class="link" data-entit