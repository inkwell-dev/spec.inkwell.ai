pacing" textLength="96.1318" x="352.11" y="212.8145">-isRead : Boolean</text></g><!--class NotificationType--><g class="entity" data-qualified-name="NotificationType" data-source-line="41" id="ent0008"><rect fill="#DAE8FC" height="83.1875" style="stroke:#000000;stroke-width:0.5;" width="96.0947" x="109.73" y="7"/><text fill="#000000" font-family="DejaVu Sans" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="91.9512" x="111.8018" y="23.1387">&#171;Enumeration&#187;</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="90.0947" x="112.73" y="36.1792">NotificationType</text><line style="stroke:#000000;stroke-width:0.5;" x1="110.73" x2="204.8247" y1="43.7734" y2="43.7734"/><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="10.4897" x="115.73" y="57.9839">...</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="77.0107" x="115.73" y="70.7886">comment_like</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacing" textLength="25.749" x="115.73" y="83.5933">save</text></g><g class="entity" data-qualified-name="N1" data-source-line="57" id="ent0017"><path d="M224.14,11.58 L224.14,85.6034 L551.4159,85.6034 L551.4159,21.58 L541.4159,11.58 L224.14,11.58" fill="#FFF2CC" style="stroke:#D6B656;stroke-width:0.5;"/><path d="M541.4159,11.58 L541.4159,21.58 L551.4159,21.58 L541.4159,11.58" fill="#FFF2CC" style="stroke:#D6B656;stroke-width:1;"/><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="282.3906" x="230.14" y="26.7904">Each table carries a unique constraint on its pair &#8212;</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="293.3745" x="230.14" y="39.5951">(user, comment), (blocker, blocked), (user, article) &#8212;</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="294.5562" x="230.14" y="52.3998">so a repeated request is a no-op, and a notification is</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="260.8687" x="230.14" y="65.2045">emitted only when a row was actually inserted.</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="306.2759" x="230.14" y="78.0092">blocks also has a CHECK: no one can block themselves.</text></g><g class="entity" data-qualified-name="N2" data-source-line="65" id="ent0018"><path d="M6,160.59 L6,209.0041 L309.5518,209.0041 L309.5518,170.59 L299.5518,160.59 L6,160.59" fill="#FFF2CC" style="stroke:#D6B656;stroke-width:0.5;"/><path d="M299.5518,160.59 L299.5518,170.59 L309.5518,170.59 L299.5518,160.59" fill="#FFF2CC" style="stroke:#D6B656;stroke-width:1;"/><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="273.0718" x="12" y="175.8004">A block row is directional, but every read treats it</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="282.5518" x="12" y="188.6051">both ways: a block in either direction hides the two</text><text fill="#000000" font-family="DejaVu Sans" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="145.2129" x="12" y="201.4098">accounts from each other.</text></g><!--link User to CommentLike--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" data-link-type="association" data-source-line="47" id="lnk9"><path codeLine="47" d="M640.19,77.01 C645.24,88.07 650.73,101.06 654.78,113.19 C674.01,170.92 688.12,240.99 695.02,278.94" fill="none" id="User-CommentLike" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="DejaVu Sans" font-size="11" lengthAdjust="spacin